plugins:
  - rubocop-performance
  - rubocop-rails
  - rubocop-sorbet

inherit_gem:
  rubocop-rails_config:
    - config/rails.yml

AllCops:
  SuggestExtensions: false
  NewCops: enable
  TargetRubyVersion: 4.0
  TargetRailsVersion: 8.1
  Exclude:
    - 'ext/**/*'
    - 'db/**/*'
    - '**/vendor/**/*'

# rails_config sets DisabledByDefault; enabling a department opts in its default
# cops without turning off the rails_config ones.
Lint:
  Enabled: true

Security:
  Enabled: true

Performance:
  Enabled: true

# Decision tables of literal or constant results (Solution#visible_to?) read better unmerged.
Lint/DuplicateBranch:
  IgnoreLiteralBranches: true
  IgnoreConstantBranches: true

# Would rewrite the Swagger DSL's `key :'$ref'` to `key :$ref`.
Lint/SymbolConversion:
  Enabled: false

# Style
# Ruby 3.1+ shorthand (`{ x: }`) would rewrite ~600 hashes; not worth the churn.
Style/HashSyntax:
  EnforcedShorthandSyntax: either

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: single_quotes

Style/Documentation:
  Enabled: false

Style/SpecialGlobalVars:
  Enabled: false

# Metrics

Metrics/AbcSize:
  Enabled: false

Metrics/BlockNesting:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Layout/LineLength:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/ParameterLists:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

Style/MapToHash:
  Enabled: true

Sorbet/ValidSigil:
  Enabled: true

Sorbet/EnforceSigilOrder:
  Enabled: true

Sorbet/StrictSigil:
  Enabled: true
  Include:
    - 'app/**/*.rb'
    - 'lib/**/*.rb'
    - 'config/**/*.rb'
  Exclude:
    # DSL files read with instance_eval; Sorbet ignores them.
    - 'config/extra_fields/*'

Sorbet/SignatureBuildOrder:
  Enabled: true

Sorbet/ConstantsFromStrings:
  Enabled: true

# Cops that catch code a Rails upgrade breaks or deprecates.
Rails/EnumSyntax:
  Enabled: true

Rails/EnumHash:
  Enabled: true

Rails/DeprecatedActiveModelErrorsMethods:
  Enabled: true

Rails/HttpPositionalArguments:
  Enabled: true

Rails/TransactionExitStatement:
  Enabled: true

Rails/ActionOrder:
  Enabled: true

Rails/ActiveRecordCallbacksOrder:
  Enabled: true
