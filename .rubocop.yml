require:
  - rubocop-sorbet

inherit_gem:
  rubocop-rails_config:
    - config/rails.yml

AllCops:
  SuggestExtensions: false
  NewCops: disable
  TargetRubyVersion: 3.3
  TargetRailsVersion: 8.0
  Exclude:
    - 'ext/**/*'
    - 'db/**/*'
    - '**/vendor/**/*'

# rails_config sets DisabledByDefault; enabling a department opts in its default
# cops without turning off the rails_config ones.
Lint:
  Enabled: true

Security:
  Enabled: true

# Style
# Ruby 3.1+ shorthand (`{ x: }`) would rewrite ~600 hashes; not worth the churn.
Style/HashSyntax:
  EnforcedShorthandSyntax: either

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: single_quotes

Style/Documentation:
  Enabled: false

Style/SpecialGlobalVars:
  Enabled: false

# Metrics

Metrics/AbcSize:
  Enabled: false

Metrics/BlockNesting:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Layout/LineLength:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/ParameterLists:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

Performance/RegexpMatch:
  Enabled: false

# Dormant until TargetRubyVersion 3.3; deferred to the Performance autocorrect stage.
Style/MapToHash:
  Enabled: false

Performance/SelectMap:
  Enabled: false

Performance/MapCompact:
  Enabled: false

Sorbet/ValidSigil:
  Enabled: true

Sorbet/EnforceSigilOrder:
  Enabled: true

Sorbet/StrictSigil:
  Enabled: true
  Include:
    - 'app/**/*.rb'
    - 'lib/**/*.rb'
    - 'config/**/*.rb'
  Exclude:
    # DSL files read with instance_eval; Sorbet ignores them.
    - 'config/extra_fields/*'

Sorbet/SignatureBuildOrder:
  Enabled: true

Sorbet/ConstantsFromStrings:
  Enabled: true

# Cops that catch code a Rails upgrade breaks or deprecates.
Rails/EnumSyntax:
  Enabled: true

Rails/EnumHash:
  Enabled: true

Rails/DeprecatedActiveModelErrorsMethods:
  Enabled: true

Rails/HttpPositionalArguments:
  Enabled: true

Rails/TransactionExitStatement:
  Enabled: true

Rails/ActionOrder:
  Enabled: true

Rails/ActiveRecordCallbacksOrder:
  Enabled: true
